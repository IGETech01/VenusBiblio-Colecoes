name: Validar catalogos publicos do Workshop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-catalogos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Conferir catalogos, arquivos permitidos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir estrutura publica
        run: python scripts/validar_catalogos.py
      - name: Executar testes de regressao do catalogo
        run: python -m unittest discover -s tests -p 'test_*.py' -v
